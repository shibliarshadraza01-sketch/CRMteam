[pytest]
# pytest-django integration for the Qualify Learn CRM backend.

# Use development settings when running the test suite.
DJANGO_SETTINGS_MODULE = config.settings.development

# Test discovery patterns.
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*

# Only look for tests inside the backend project (avoid scanning the venv).
testpaths = .
norecursedirs = .venv .git __pycache__ staticfiles
